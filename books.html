<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | Library Management System</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/books.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <h1>Library Management System</h1>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="books.html" class="active">Books</a>
            <a href="add-book.html">Add Book</a>
        </div>

    </nav>

    <div class="container">

        <div class="page-title">
            <h2>Library Books</h2>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by Title or Author" onkeyup="searchBooks()">
        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="bookTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <footer class="footer">
        <p>© 2026 Library Management System | Developed by Harshitha Minnikanti</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/editBook.js"></script>
    <script src="js/books.js"></script>

</body>

</html>
